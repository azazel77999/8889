
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gatitos y Perritos</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #fce7f3;
            color: #333;
            text-align: center;
            transition: background-color 0.4s ease;
        }

        header {
            padding: 30px 15px 20px;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 2rem;
        }

        header p {
            margin: 0;
            font-size: 1.1rem;
        }

        nav {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin: 10px 15px 25px;
        }

        .pestana {
            padding: 12px 25px;
            border: none;
            border-radius: 12px;
            background-color: white;
            color: #333;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 3px 8px #00000015;
        }

        .pestana.activa {
            background-color: #a855f7;
            color: white;
        }

        main {
            width: 100%;
            max-width: 650px;
            margin: 0 auto;
            padding: 0 18px 35px;
        }

        .seccion {
            display: none;
        }

        .seccion.activa {
            display: block;
        }

        .tarjeta {
            padding: 22px;
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 6px 18px #00000015;
        }

        .tarjeta h2 {
            margin-top: 0;
        }

        .animal {
            display: block;
            width: 100%;
            max-width: 400px;
            height: 400px;
            margin: 15px auto 20px;
            object-fit: cover;
            border-radius: 16px;
            background-color: #f3f4f6;
        }

        .boton-animal {
            padding: 13px 24px;
            border: none;
            border-radius: 12px;
            background-color: #a855f7;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }

        .boton-animal:hover {
            opacity: 0.9;
            transform: scale(1.03);
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.7rem;
            }

            .animal {
                height: auto;
                aspect-ratio: 1 / 1;
            }

            .tarjeta {
                padding: 16px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Gatitos y perritos pendejos</h1>
        <p>Bienvenido we</p>
    </header>

    <nav>
        <button
            class="pestana activa"
            id="pestanaGatitos"
            onclick="mostrarSeccion('gatos')">
            Gatitos
        </button>

        <button
            class="pestana"
            id="pestanaPerritos"
            onclick="mostrarSeccion('perros')">
            Perritos
        </button>
    </nav>

    <main>
        <section class="seccion activa" id="seccionGatos">
            <div class="tarjeta">
                <h2>Gatitos pendejos 🐱</h2>

                <img
                    id="imagenGato"
                    class="animal"
                    src="https://cataas.com/cat/kitten?width=400&height=400"
                    alt="Gatito pequeño">

                <button
                    class="boton-animal"
                    onclick="otroAnimal('gato')">
                    Otro gatito
                </button>
            </div>
        </section>

        <section class="seccion" id="seccionPerros">
            <div class="tarjeta">
                <h2>Perritos pendejos🐶</h2>

                <img
                    id="imagenPerro"
                    class="animal"
                    src="https://api.sykes.pet/puppy/imgs/puppy191.jpg"
                    alt="Perrito cachorro">

                <button
                    class="boton-animal"
                    onclick="otroAnimal('perro')">
                    Otro perrito
                </button>
            </div>
        </section>
    </main>

    <script>
        function cambiarColor() {
            const colores = [
                "#fce7f3",
                "#dbeafe",
                "#dcfce7",
                "#fef3c7",
                "#ede9fe",
                "#ffedd5",
                "#cffafe",
                "#f3e8ff",
                "#ffe4e6",
                "#e0f2fe"
            ];

            const colorActual = document.body.style.backgroundColor;
            let nuevoColor;

            do {
                nuevoColor =
                    colores[Math.floor(Math.random() * colores.length)];
            } while (
                colores.length > 1 &&
                nuevoColor === colorActual
            );

            document.body.style.backgroundColor = nuevoColor;
        }

        function mostrarSeccion(tipo) {
            cambiarColor();

            const esGato = tipo === "gatos";

            document.getElementById("seccionGatos")
                .classList.toggle("activa", esGato);

            document.getElementById("seccionPerros")
                .classList.toggle("activa", !esGato);

            document.getElementById("pestanaGatitos")
                .classList.toggle("activa", esGato);

            document.getElementById("pestanaPerritos")
                .classList.toggle("activa", !esGato);
        }

        function otroAnimal(tipo) {
            cambiarColor();

            if (tipo === "gato") {
                const imagenGato =
                    document.getElementById("imagenGato");

                imagenGato.src =
                    "https://cataas.com/cat/kitten?width=400&height=400&v="
                    + Date.now();

            } else {
                cargarOtroCachorro();
            }
        }

        async function cargarOtroCachorro() {
            const imagenPerro =
                document.getElementById("imagenPerro");

            try {
                const respuesta = await fetch(
                    "https://api.sykes.pet/puppy?v=" + Date.now(),
                    { cache: "no-store" }
                );

                if (!respuesta.ok) {
                    throw new Error("No se pudo obtener la imagen");
                }

                const datos = await respuesta.json();
                const url = datos.data?.puppy || datos.puppy;

                if (!url) {
                    throw new Error("La respuesta no contiene una imagen");
                }

                const nuevaImagen = new Image();

                nuevaImagen.onload = function () {
                    imagenPerro.src = nuevaImagen.src;
                };

                nuevaImagen.src = url;

            } catch (error) {
                console.error(
                    "No se pudo cargar otro cachorro:",
                    error
                );
            }
        }

        cambiarColor();
    </script>

</body>
</html>
