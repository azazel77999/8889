
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gatitos y Perritos pendejos</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #121212;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            transition: background-color 0.4s ease;
        }

        header {
            padding: 25px 15px;
        }

        h1 {
            font-size: 2rem;
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 12px;
            padding: 15px;
            background: #202020;
        }

        nav button {
            padding: 13px 25px;
            border: none;
            border-radius: 12px;
            background: #333;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        nav button.activo {
            background: #a855f7;
        }

        .apartado {
            display: none;
            min-height: 65vh;
            padding: 25px 15px;
        }

        .apartado.activo {
            display: block;
        }

        .tarjeta {
            max-width: 420px;
            margin: 25px auto;
            padding: 22px;
            background: #202020;
            border-radius: 20px;
        }

        .animal {
            display: block;
            width: 280px;
            height: 280px;
            max-width: 100%;
            object-fit: cover;
            border-radius: 18px;
            margin: 20px auto;
            background: #333;
        }

        .boton {
            padding: 14px 24px;
            border: none;
            border-radius: 12px;
            background: #a855f7;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .boton:hover {
            background: #9333ea;
        }

        .boton:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        footer {
            padding: 20px;
            color: #aaa;
        }
    </style>
</head>

<body>

    <header>
        <h1>Gatitos y Perritos pendejos</h1>
        <p>Bienvenido we</p>
    </header>

    <nav>
        <button class="activo" onclick="mostrar('gatitos', this)">
            Gatitos
        </button>

        <button onclick="mostrar('perritos', this)">
            Perritos
        </button>
    </nav>

    <main>
        <section id="gatitos" class="apartado activo">
            <h2>Gatitos pendejos</h2>
            <p>Miralos we</p>

            <div class="tarjeta">
                <img
                    id="imagenGato"
                    class="animal"
                    src="https://images.unsplash.com/photo-1573865526739-10659fec78a5?auto=format&fit=crop&w=400&h=400&q=80"
                    alt="Gatito"
                >

                <button class="boton" onclick="otroAnimal('gato', this)">
                    Otro gatito
                </button>
            </div>
        </section>

        <section id="perritos" class="apartado">
            <h2>Perritos pendejos</h2>
            <p>Míralos we</p>

            <div class="tarjeta">
                <img
                    id="imagenPerro"
                    class="animal"
                    src="https://images.unsplash.com/photo-1552053831-71594a27632d?auto=format&fit=crop&w=400&h=400&q=80"
                    alt="Perrito"
                >

                <button class="boton" onclick="otroAnimal('perro', this)">
                    Otro perrito
                </button>
            </div>
        </section>
    </main>

    <footer>
        Hecho para los amantes de los animales.
    </footer>

    <script>
        const colores = [
            "#121212",
            "#1a237e",
            "#004d40",
            "#4a148c",
            "#7f1d1d",
            "#263238",
            "#880e4f",
            "#3e2723",
            "#0d47a1",
            "#5d4037"
        ];

        let ultimoColor = 0;

        const imagenesUsadas = {
            gato: new Set(),
            perro: new Set()
        };

        function mostrar(id, boton) {
            document.querySelectorAll(".apartado").forEach(seccion => {
                seccion.classList.remove("activo");
            });

            document.getElementById(id).classList.add("activo");

            document.querySelectorAll("nav button").forEach(b => {
                b.classList.remove("activo");
            });

            boton.classList.add("activo");
            cambiarColor();
            window.scrollTo(0, 0);
        }

        function cambiarColor() {
            let nuevoColor;

            do {
                nuevoColor = Math.floor(Math.random() * colores.length);
            } while (nuevoColor === ultimoColor);

            document.body.style.backgroundColor = colores[nuevoColor];
            ultimoColor = nuevoColor;
        }

        async function otroAnimal(tipo, boton) {
            cambiarColor();

            const esGato = tipo === "gato";
            const imagen = document.getElementById(
                esGato ? "imagenGato" : "imagenPerro"
            );

            const categoria = esGato
                ? "Category:Kittens"
                : "Category:Puppies";

            boton.disabled = true;

            const textoOriginal = boton.textContent;
            boton.textContent = "Buscando foto...";

            try {
                const url =
                    "https://commons.wikimedia.org/w/api.php" +
                    "?action=query" +
                    "&generator=categorymembers" +
                    "&gcmtitle=" + encodeURIComponent(categoria) +
                    "&gcmtype=file" +
                    "&gcmnamespace=6" +
                    "&gcmlimit=100" +
                    "&prop=imageinfo" +
                    "&iiprop=url" +
                    "&iiurlwidth=500" +
                    "&format=json" +
                    "&origin=*";

                const respuesta = await fetch(url);

                if (!respuesta.ok) {
                    throw new Error("No se pudieron cargar las fotos");
                }

                const datos = await respuesta.json();
                const paginas = Object.values(datos.query?.pages || {});

                const fotos = paginas
                    .filter(p => p.imageinfo && p.imageinfo[0])
                    .map(p => ({
                        titulo: p.title,
                        url: p.imageinfo[0].thumburl ||
                             p.imageinfo[0].url
                    }))
                    .filter(f => /\.(jpg|jpeg|png|webp|gif)$/i.test(f.url));

                if (fotos.length === 0) {
                    throw new Error("No se encontraron fotos");
                }

                let disponibles = fotos.filter(
                    foto => !imagenesUsadas[tipo].has(foto.titulo)
                );

                if (disponibles.length === 0) {
                    imagenesUsadas[tipo].clear();
                    disponibles = fotos;
                }

                const foto =
                    disponibles[Math.floor(Math.random() * disponibles.length)];

                await new Promise((resolve, reject) => {
                    const prueba = new Image();

                    prueba.onload = () => resolve();
                    prueba.onerror = () => reject(
                        new Error("No se pudo abrir la foto")
                    );

                    prueba.src = foto.url;
                });

                imagen.src = foto.url;
                imagen.alt = esGato ? "Gatito" : "Cachorro";
                imagenesUsadas[tipo].add(foto.titulo);

            } catch (error) {
                alert(
                    "No se pudieron cargar nuevas fotos. " +
                    "Comprueba tu conexión e inténtalo otra vez."
                );
            } finally {
                boton.disabled = false;
                boton.textContent = textoOriginal;
            }
        }

        window.addEventListener("load", () => {
            otroAnimal("gato", document.querySelector(
                "#gatitos .boton"
            ));

            otroAnimal("perro", document.querySelector(
                "#perritos .boton"
            ));
        });
    </script>

</body>
</html>
