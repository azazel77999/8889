
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gatitos y Perritos pendejos</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #121212;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            transition: background-color 0.4s ease;
        }

        header {
            padding: 25px 15px;
        }

        h1 {
            font-size: 2rem;
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 12px;
            padding: 15px;
            background: #202020;
        }

        nav button {
            padding: 13px 25px;
            border: none;
            border-radius: 12px;
            background: #333;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        nav button.activo {
            background: #a855f7;
        }

        .apartado {
            display: none;
            min-height: 65vh;
            padding: 25px 15px;
        }

        .apartado.activo {
            display: block;
        }

        .tarjeta {
            max-width: 420px;
            margin: 25px auto;
            padding: 22px;
            background: #202020;
            border-radius: 20px;
        }

        .animal {
            display: block;
            width: 280px;
            height: 280px;
            max-width: 100%;
            object-fit: cover;
            border-radius: 18px;
            margin: 20px auto;
            background: #333;
        }

        .boton {
            padding: 14px 24px;
            border: none;
            border-radius: 12px;
            background: #a855f7;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .boton:hover {
            background: #9333ea;
        }

        footer {
            padding: 20px;
            color: #aaa;
        }
    </style>
</head>

<body>

    <header> 
        <h1>Gatitos y perritos pendejos</h1>
        <p>Bienvenido we</p>
    </header>

    <nav>
        <button class="activo" onclick="mostrar('gatitos', this)">
            Gatitos
        </button>

        <button onclick="mostrar('perritos', this)">
            Perritos
        </button>
    </nav>

    <main>
        <section id="gatitos" class="apartado activo">
            <h2>Gatitos pendejos</h2>
            <p>Miralos we</p>

            <div class="tarjeta">
                <img
                    id="imagenGato"
                    class="animal"
                    src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?auto=format&fit=crop&w=400&h=400&q=80"
                    alt="Gatito"
                >

                <button class="boton" onclick="otroAnimal('gato')">
                    Otro gatito
                </button>
            </div>
        </section>

        <section id="perritos" class="apartado">
            <h2>Perritos pendejos</h2>
            <p>Míralos we</p>

            <div class="tarjeta">
                <img
                    id="imagenPerro"
                    class="animal"
                    src="https://images.unsplash.com/photo-1552053831-71594a27632d?auto=format&fit=crop&w=400&h=400&q=80"
                    alt="Perrito"
                >

                <button class="boton" onclick="otroAnimal('perro')">
                    Otro perrito
                </button>
            </div>
        </section>
    </main>

    <footer>
        Hecho para los amantes de los animales.
    </footer>

    <script>
        const colores = [
            "#121212",
            "#1a237e",
            "#004d40",
            "#4a148c",
            "#7f1d1d",
            "#263238",
            "#880e4f",
            "#3e2723",
            "#0d47a1",
            "#5d4037"
        ];

        const gatitos = [
            "https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?auto=format&fit=crop&w=400&h=400&q=80",
            "https://images.unsplash.com/photo-1573865526739-10659fec78a5?auto=format&fit=crop&w=400&h=400&q=80",
            "https://images.unsplash.com/photo-1533738363-b7f9aef128ce?auto=format&fit=crop&w=400&h=400&q=80"
        ];

        const perritos = [
            "https://images.unsplash.com/photo-1552053831-71594a27632d?auto=format&fit=crop&w=400&h=400&q=80",
            "https://images.unsplash.com/photo-1543466835-00a7907e9de1?auto=format&fit=crop&w=400&h=400&q=80",
            "https://images.unsplash.com/photo-1517849845537-4d257902454a?auto=format&fit=crop&w=400&h=400&q=80"
        ];

        let ultimoColor = 0;

        function mostrar(id, boton) {
            document.querySelectorAll(".apartado").forEach(seccion => {
                seccion.classList.remove("activo");
            });

            document.getElementById(id).classList.add("activo");

            document.querySelectorAll("nav button").forEach(b => {
                b.classList.remove("activo");
            });

            boton.classList.add("activo");

            cambiarColor();
            window.scrollTo(0, 0);
        }

        function cambiarColor() {
            let nuevoColor;

            do {
                nuevoColor = Math.floor(Math.random() * colores.length);
            } while (nuevoColor === ultimoColor);

            document.body.style.backgroundColor = colores[nuevoColor];
            ultimoColor = nuevoColor;
        }

        function otroAnimal(tipo) {
            cambiarColor();

            const esGato = tipo === "gato";
            const lista = esGato ? gatitos : perritos;
            const imagen = document.getElementById(
                esGato ? "imagenGato" : "imagenPerro"
            );

            const actual = imagen.src;
            const disponibles = lista.filter(url => url !== actual);

            const nueva = disponibles[
                Math.floor(Math.random() * disponibles.length)
            ];

            imagen.src = nueva;
        }
    </script>

</body>
</html>
