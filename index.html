
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi rincón de animales</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #121212;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            transition: background 0.4s;
        }

        header {
            padding: 25px 15px;
        }

        h1 {
            font-size: 2rem;
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            padding: 12px;
            background: #202020;
            position: sticky;
            top: 0;
        }

        nav button {
            background: #333;
            color: white;
            border: none;
            padding: 12px 17px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
        }

        nav button.activo {
            background: #a855f7;
        }

        .apartado {
            display: none;
            padding: 25px 15px 45px;
            min-height: 65vh;
        }

        .apartado.activo {
            display: block;
        }

        .tarjeta {
            max-width: 420px;
            margin: 25px auto;
            padding: 22px;
            border-radius: 20px;
            background: #202020;
        }

        .animal {
            width: 280px;
            height: 280px;
            max-width: 100%;
            object-fit: cover;
            border-radius: 18px;
            background: #333;
            display: block;
            margin: 20px auto;
        }

        .boton {
            background: #a855f7;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 13px 22px;
            margin: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .perros .boton {
            background: #e58b45;
        }

        .color {
            background: #3478f6;
        }

        footer {
            padding: 20px;
            color: #aaa;
        }
    </style>
</head>

<body>

    <header>
        <h1>¡Qué rollo, cabrones!</h1>
        <p>Bienvenidos</p>
    </header>

    <nav>
        <button class="activo" onclick="mostrar('inicio', this)">
            Inicio
        </button>

        <button onclick="mostrar('gatitos', this)">
            Gatitos
        </button>

        <button onclick="mostrar('perritos', this)">
            Perritos
        </button>
    </nav>

    <main>

        <section id="inicio" class="apartado activo">
            <h2>Bienvenidos a mi página</h2>
            <p>Un pequeño rincón para los amantes de los animales.</p>

            <button class="boton" onclick="mostrarDesdeInicio('gatitos')">
                Ver gatitos
            </button>

            <button class="boton" onclick="mostrarDesdeInicio('perritos')">
                Ver perritos
            </button>

            <br>

            <button class="boton color" onclick="cambiarColor()">
                Cambiar color de fondo
            </button>
        </section>

        <section id="gatitos" class="apartado">
            <h2>Gatitos pequeños</h2>
            <p>¡Mira estas pequeñas bolas de pelo!</p>

            <div class="tarjeta">
                <img
                    id="imagenGato"
                    class="animal"
                    src="https://cataas.com/cat?width=400&height=400"
                    alt="Gatito"
                >

                <button class="boton" onclick="otroGato()">
                    Otro gatito
                </button>
            </div>
        </section>

        <section id="perritos" class="apartado perros">
            <h2>Perritos pequeños</h2>
            <p>¡Los cachorros más adorables!</p>

            <div class="tarjeta">
                <img
                    id="imagenPerro"
                    class="animal"
                    src="https://placedog.net/400/400"
                    alt="Perrito"
                >

                <button class="boton" onclick="otroPerro()">
                    Otro perrito
                </button>
            </div>
        </section>

    </main>

    <footer>
        Hecho para los amantes de los animales.
    </footer>

    <script>
        function mostrar(id, boton) {
            document.querySelectorAll(".apartado").forEach(seccion => {
                seccion.classList.remove("activo");
            });

            document.getElementById(id).classList.add("activo");

            document.querySelectorAll("nav button").forEach(b => {
                b.classList.remove("activo");
            });

            boton.classList.add("activo");
            window.scrollTo(0, 0);
        }

        function mostrarDesdeInicio(id) {
            const botones = document.querySelectorAll("nav button");
            const boton = id === "gatitos" ? botones[1] : botones[2];
            mostrar(id, boton);
        }

        function otroGato() {
            document.getElementById("imagenGato").src =
                "https://cataas.com/cat?width=400&height=400&v="
                + Date.now();
        }

        function otroPerro() {
            document.getElementById("imagenPerro").src =
                "https://placedog.net/400/400?random="
                + Date.now();
        }

        const colores = [
            "#121212",
            "#1a237e",
            "#004d40",
            "#4a148c",
            "#7f1d1d",
            "#263238",
            "#880e4f",
            "#3e2723",
            "#0d47a1"
        ];

        function cambiarColor() {
            const color = colores[
                Math.floor(Math.random() * colores.length)
            ];

            document.body.style.backgroundColor = color;
        }
    </script>

</body>
</html>
