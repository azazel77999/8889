
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gatitos y Perritos pendejos</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #fce7f3;
            color: #333;
            text-align: center;
            transition: background-color 0.4s ease;
        }

        header {
            padding: 30px 15px 20px;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 2rem;
        }

        header p {
            margin: 0;
            font-size: 1.1rem;
        }

        nav {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin: 10px 15px 25px;
        }

        .pestana {
            padding: 12px 25px;
            border: none;
            border-radius: 12px;
            background-color: #ffffff;
            color: #333;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 3px 8px #00000015;
        }

        .pestana.activa {
            background-color: #a855f7;
            color: white;
        }

        main {
            width: 100%;
            max-width: 650px;
            margin: 0 auto;
            padding: 0 18px 35px;
        }

        .seccion {
            display: none;
        }

        .seccion.activa {
            display: block;
        }

        .tarjeta {
            padding: 22px;
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 6px 18px #00000015;
        }

        .tarjeta h2 {
            margin-top: 0;
        }

        .animal {
            display: block;
            width: 100%;
            max-width: 400px;
            height: 400px;
            margin: 15px auto 20px;
            object-fit: cover;
            border-radius: 16px;
            background-color: #f3f4f6;
        }

        .boton-animal {
            padding: 13px 24px;
            border: none;
            border-radius: 12px;
            background-color: #a855f7;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }

        .boton-animal:hover {
            opacity: 0.9;
            transform: scale(1.03);
        }

        .boton-animal:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .mensaje {
            min-height: 20px;
            margin: 12px 0 0;
            font-size: 14px;
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.7rem;
            }

            .animal {
                height: auto;
                aspect-ratio: 1 / 1;
            }

            .tarjeta {
                padding: 16px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Gatitos y perritos pendejos</h1>
        <p>Bienvenido we</p>
    </header>

    <nav>
        <button
            class="pestana activa"
            id="pestanaGatitos"
            onclick="mostrarSeccion('gatos')">
            Gatitos
        </button>

        <button
            class="pestana"
            id="pestanaPerritos"
            onclick="mostrarSeccion('perros')">
            Perritos
        </button>
    </nav>

    <main>

        <section class="seccion activa" id="seccionGatos">
            <div class="tarjeta">
                <h2>Gatitos pendejos 🐱</h2>

                <img
                    id="imagenGato"
                    class="animal"
                    src="https://cataas.com/cat/kitten?width=400&height=400"
                    alt="Gatito pequeño"
                    loading="eager">

                <button
                    class="boton-animal"
                    id="botonGato"
                    onclick="otroAnimal('gato')">
                    Otro gatito
                </button>

                <p class="mensaje" id="mensajeGato"></p>
            </div>
        </section>

        <section class="seccion" id="seccionPerros">
            <div class="tarjeta">
                <h2>Perritos pendejos 🐶</h2>

                <img
                    id="imagenPerro"
                    class="animal"
                    src="https://api.sykes.pet/puppy/imgs/puppy149.jpg"
                    alt="Perrito cachorro"
                    loading="eager">

                <button
                    class="boton-animal"
                    id="botonPerro"
                    onclick="otroAnimal('perro')">
                    Otro perrito
                </button>

                <p class="mensaje" id="mensajePerro"></p>
            </div>
        </section>

    </main>

    <script>
        // Colores aleatorios para el fondo.
        function cambiarColor() {
            const colores = [
                "#fce7f3",
                "#dbeafe",
                "#dcfce7",
                "#fef3c7",
                "#ede9fe",
                "#ffedd5",
                "#cffafe",
                "#f3e8ff",
                "#ffe4e6",
                "#e0f2fe"
            ];

            const colorActual = document.body.style.backgroundColor;
            let nuevoColor;

            do {
                nuevoColor =
                    colores[Math.floor(Math.random() * colores.length)];
            } while (
                colores.length > 1 &&
                nuevoColor === colorActual
            );

            document.body.style.backgroundColor = nuevoColor;
        }

        // Cambiar entre las pestañas Gatitos y Perritos.
        function mostrarSeccion(tipo) {
            cambiarColor();

            const esGato = tipo === "gatos";

            document.getElementById("seccionGatos")
                .classList.toggle("activa", esGato);

            document.getElementById("seccionPerros")
                .classList.toggle("activa", !esGato);

            document.getElementById("pestanaGatitos")
                .classList.toggle("activa", esGato);

            document.getElementById("pestanaPerritos")
                .classList.toggle("activa", !esGato);
        }

        // Cargar otro gatito usando CATAAS.
        function otroGatito() {
            const imagen = document.getElementById("imagenGato");
            const mensaje = document.getElementById("mensajeGato");
            const boton = document.getElementById("botonGato");

            cambiarColor();
            boton.disabled = true;
            mensaje.textContent = "Buscando otro gatito...";

            const nuevaImagen =
                "https://cataas.com/cat/kitten?width=400&height=400&v="
                + Date.now();

            imagen.onload = function () {
                boton.disabled = false;
                mensaje.textContent = "";
            };

            imagen.onerror = function () {
                boton.disabled = false;
                mensaje.textContent =
                    "No se pudo cargar la imagen. Intenta otra vez.";
            };

            imagen.src = nuevaImagen;
        }

        // Cargar otro cachorro desde el servicio de Sykes.pet.
        async function otroPerrito() {
            const imagen = document.getElementById("imagenPerro");
            const mensaje = document.getElementById("mensajePerro");
            const boton = document.getElementById("botonPerro");

            cambiarColor();
            boton.disabled = true;
            mensaje.textContent = "Buscando otro cachorrito...";

            try {
                const respuesta = await fetch(
                    "https://api.sykes.pet/puppy?v=" + Date.now(),
                    { cache: "no-store" }
                );

                if (!respuesta.ok) {
                    throw new Error("No se pudo consultar el servicio");
                }

                const datos = await respuesta.json();

                const url =
                    datos?.data?.puppy ||
                    datos?.puppy ||
                    datos?.url;

                if (!url) {
                    throw new Error("No se encontró una imagen");
                }

                // Confirmar que la imagen nueva cargó antes de reemplazar
                // la que ya se está mostrando.
                const prueba = new Image();

                prueba.onload = function () {
                    imagen.src = url;
                    boton.disabled = false;
                    mensaje.textContent = "";
                };

                prueba.onerror = function () {
                    boton.disabled = false;
                    mensaje.textContent =
                        "No se pudo cargar el cachorro. Intenta otra vez.";
                };

                prueba.src = url;

            } catch (error) {
                boton.disabled = false;
                mensaje.textContent =
                    "El servicio de cachorros no respondió. Intenta otra vez.";
            }
        }

        // Función que usan los botones de cada animal.
        function otroAnimal(tipo) {
            if (tipo === "gato") {
                otroGatito();
            } else {
                otroPerrito();
            }
        }

        // Cambiar el fondo al cargar la página.
        cambiarColor();
    </script>

</body>
</html>
